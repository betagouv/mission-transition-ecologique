name: Run tests
on:
  push:
    branches:
      - main
  pull_request:

# A new commit on a pull request cancels the run of the previous one (runs on main always finish)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

jobs:
  validate-data:
    name: Validation des données de dispositifs sur la base d'un JSON Schema
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [ '22.x' ]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm clean-install --foreground-scripts

      - run: npx nx run @tee/data:test

  lint:
    name: Run eslint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [ '22.x' ]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm clean-install --foreground-scripts

      - run: npm run lint

  lint-css:
    name: Run stylelint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [ '22.x' ]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm clean-install --foreground-scripts

      - run: npx nx run @tee/nuxt:sass-lint -f github


  type-check:
    name: Run type-check
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [ '22.x' ]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm clean-install --foreground-scripts

      - run: npm run type:check

  unit-test:
    name: Run unit tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: ['22.x']

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm clean-install --foreground-scripts

      - run: npx nx run @tee/backend-ddd:test

      - run: npx nx run @tee/nuxt:test
