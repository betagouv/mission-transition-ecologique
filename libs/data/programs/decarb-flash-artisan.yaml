titre: Decarb Flash Artisan
promesse: Financez l'électrification de votre entreprise artisanale
description: >-
  Financez l'électrification de votre entreprise artisanale, et notamment le
  remplacement de vos équipements fonctionnant à l'énergie fossile par des
  équipements électriques.
description longue: >-
  Les actions éligibles sont les suivantes et devront respecter les montants
  d’investissement minimaux et maximaux présentés dans le cahier des charges :


  - Fours à pain électriques.

  - Cabines de peinture électrique.

  - Cuisson électrique.

  - Matériel de lavage, séchage et repassage électrique.

  - Fours électriques pour les métiers d’art et la fabrication artisanale.


  &nbsp;
début de validité: 30/09/2026
fin de validité: 15/06/2027
illustration: images/TEE_energie_verte.webp
opérateur de contact: ADEME
contact question: https://agirpourlatransition.ademe.fr/form/contact?id_dsp=DSP000999
url: >-
  https://agirpourlatransition.ademe.fr/entreprises/aides-financieres/catalogue/aap/decarb-flash-artisan
nature de l'aide: financement
montant du financement: Aide de 20% à 50% selon le projet et la taille de l'entreprise
objectifs:
  - description: >-
      Consultez la documentation de l’ADEME ou contactez un conseiller pour
      vérifier l’éligibilité de votre projet.
    liens:
      - lien: >-
          https://agirpourlatransition.ademe.fr/sites/default/files/Decarb%20Flash%20Artisan%20-%20Annexes%20actions%20et%20codes%20NAF%20%C3%A9ligibles%20-%202026.pdf
        texte: Actions et codes NAF éligibles
      - lien: >-
          https://file:///Users/betagouv/Downloads/Decarb%20Flash%20Artisan%20-%20Cahier%20des%20charges%20-%202026%20.pdf
        texte: Cahier des charges
  - description: Créez un compte ADEME pour pouvoir déposer votre dossier.
    liens:
      - lien: https://agirpourlatransition.ademe.fr/inscription
        texte: Créer mon compte ADEME
  - description: >-
      Déposez votre demande d'aide : informations administratives, description
      du projet, détails techniques et financiers, étude de faisabilité, etc. À
      ce stade, votre investissement ne doit pas avoir été réalisé !
    liens:
      - lien: >-
          https://moncompte.ademe.fr/auth/realms/master/protocol/openid-connect/auth?client_id=prod-opale&redirect_uri=https%3A%2F%2Fvosaides.ademe.fr%2Flogin&state=2dbb8456-2628-471e-92c4-3822b2a09b86&response_mode=fragment&response_type=code&scope=openid&nonce=79a4f38c-70d5-4388-8ee9-b4c7651e4dcb&code_challenge=gZRmwgdwo6p68Oo6Nb0L_-CeoM0yqM6rt0FdW2rtzfA&code_challenge_method=S256
        texte: Déposer mon dossier
  - description: >-
      L'ADEME étudie votre demande d'aide. Si votre demande est acceptée,
      recevez un contrat de financement précisant le montant d’aide maximum, les
      conditions et les modalités de versement.
  - description: Réalisez vos investissements.
conditions d'éligibilité:
  taille de l'entreprise:
    - Effectif inférieur à 249 employés
    - Éligible aux micro-entreprises
  secteur géographique:
    - France et territoires d'outre-mer
  secteur d'activité:
    - Entreprises artisanales
  nombre d'années d'activité:
    - Éligible à toutes les entreprises
publicodes:
  entreprise . est ciblée:
    toutes ces conditions:
      - est éligible
      - est dans un secteur d'activité ciblé
      - a un objectif ciblé
  entreprise . est éligible:
    applicable si:
      toutes ces conditions:
        - dispositif . début de validité <= date du jour
        - date du jour <= dispositif . fin de validité
    toutes ces conditions:
      - a un effectif éligible
  entreprise . a un effectif éligible:
    toutes ces conditions:
      - effectif <= 249
  entreprise . est dans un secteur d'activité ciblé:
    une de ces conditions:
      - code NAF niveau 1 . est C
      - code NAF niveau 1 . est D
      - code NAF niveau 1 . est E
      - code NAF niveau 1 . est F
      - code NAF niveau 1 . est G
      - code NAF niveau 1 . est H
      - code NAF niveau 1 . est I
  entreprise . a un objectif ciblé:
    une de ces conditions:
      - questionnaire . objectif prioritaire . est ma performance énergétique
      - questionnaire . objectif prioritaire . est mon impact environnemental
