titre: Accélérateur décarbonation
metaTitre: Décarbonation en entreprise - Stratégie bas carbone avec Bpifrance
promesse: Définissez une stratégie bas carbone
description: >-
  Profitez d’un accompagnement pour structurer une trajectoire de décarbonation
  ambitieuse, en lien avec vos enjeux de développement. Pendant 18 mois, 20
  entreprises créatrices de valeur seront accompagnées pour : 


  - Comprendre et structurer leur **stratégie bas carbone.**

  - Prioriser leurs **leviers de réduction** d’émissions.

  - Piloter leur **trajectoire carbone**.

  - Impliquer leurs **équipes et parties prenantes**.

  - Intégrer la **décarbonation** dans leur **modèle de performance globale**.
metaDescription: >-
  Bénéficiez de l’Accélérateur Décarbonation : un programme Bpifrance pour
  structurer votre stratégie bas carbone avec des experts référencés.
description longue: |-
  Avec l'Accélérateur Décarbonation, vous bénéficiez : 

  - De 38 jours d'accompagnement par des experts habilités. 
  - De 10 jours de formation avec une grande école. 
  - De l'intégration dans un collectif d'entrepreneurs de la filière.
début de validité: 30/09/2026
illustration: images/TEE_energie_verte.webp
opérateur de contact: Banque Publique d'Investissement France
contact question: mailto:clemence.gamblin@bpifrance.fr
url: >-
  https://evenements.bpifrance.fr/e/ami-accelerateur-decarbonation-5#:~:text=Rejoignez%20la%205%E1%B5%89%20promotion%20de%20l'Acc%C3%A9l%C3%A9rateur%20D%C3%A9carbonation&text=Ce%20programme%20vise%20%C3%A0%20soutenir,%C3%A0%20travers%20un%20accompagnement%20structur%C3%A9.
nature de l'aide: étude
coût de l'accompagnement: 29 000 € HT
durée de l'accompagnement: 38 jours de conseil et 10 jours de formation
objectifs:
  - description: Complétez le formulaire de candidature en ligne sur le site de Bpifrance.
    liens:
      - lien: >-
          https://evenements.bpifrance.fr/e/ami-accelerateur-decarbonation-5/registration/register
        texte: Inscription
  - description: >-
      Échangez avec un chargé d'affaires Bpifrance pour vérifier l’adéquation
      entre vos enjeux et le programme.
  - description: Intégrez le programme à l’issue du processus de validation par Bpifrance.
conditions d'éligibilité:
  taille de l'entreprise:
    - Plus de 50 salariés
    - Non éligible aux micro-entreprises
  secteur géographique:
    - France et territoires d'outre-mer
  secteur d'activité:
    - Tous secteurs d’activité
  nombre d'années d'activité:
    - Au moins 3 ans d’activité
  autres critères d'éligibilité:
    - >-
      Réaliser un chiffre d’affaires supérieur à 10 M€ et inférieur à 5
      milliards d'euros
    - Avoir réalisé un bilan carbone Scope 1, 2, 3, datant de moins de 2 ans
publicodes:
  entreprise . est ciblée:
    toutes ces conditions:
      - est éligible
      - est dans un secteur d'activité ciblé
      - a un objectif ciblé
  entreprise . est éligible:
    applicable si: dispositif . début de validité <= date du jour
    toutes ces conditions:
      - a un effectif éligible
      - a une categorie legale eligible
  entreprise . a un effectif éligible:
    toutes ces conditions:
      - effectif >= 50
  entreprise . a une categorie legale eligible:
    toutes ces conditions:
      - microentrepreneur = non
  entreprise . est dans un secteur d'activité ciblé:
    une de ces conditions:
      - code NAF niveau 1 . est A
      - code NAF niveau 1 . est B
      - code NAF niveau 1 . est C
      - code NAF niveau 1 . est D
      - code NAF niveau 1 . est E
      - code NAF niveau 1 . est F
      - code NAF niveau 1 . est G
      - code NAF niveau 1 . est H
      - code NAF niveau 1 . est I
      - code NAF niveau 1 . est J
      - code NAF niveau 1 . est K
      - code NAF niveau 1 . est L
      - code NAF niveau 1 . est M
      - code NAF niveau 1 . est N
      - code NAF niveau 1 . est P
      - code NAF niveau 1 . est Q
      - code NAF niveau 1 . est R
      - code NAF niveau 1 . est S
      - code NAF niveau 1 . est T
      - code NAF niveau 1 . est U
  entreprise . a un objectif ciblé:
    une de ces conditions:
      - questionnaire . objectif prioritaire . est mon impact environnemental
