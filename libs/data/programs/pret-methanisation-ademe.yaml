titre: Prêt Méthanisation Ademe
promesse: >-
  Financez votre unité de méthanisation à cogénération ou à injection dans le
  réseau de gaz
description: >-
  Le Prêt Méthanisation ADEME finance la construction d’unités de méthanisation
  à cogénération ou destinées à l’injection dans le réseau de gaz.
  L’approvisionnement du méthaniseur ne doit pas intégrer de déchets issus du
  tri mécano-biologique.


  Le prêt finance :


  - Les actifs corporels à faible valeur.

  - Les actifs immatériels.

  - L’augmentation du besoin en fonds de roulement.
description longue: >-
  - Taux fixe selon le barème en vigueur.

  - Frais de dossier : 0,40% du montant du prêt.

  - Aucune garantie sur les actifs de l’entreprise, ni sur le patrimoine du
  dirigeant.

  - Seule une retenue de garantie de 5 % du montant du prêt est prélevée. Elle
  est restituée après complet remboursement du prêt, augmentée des intérêts
  qu’elle a produits.

  - Assurance décès/perte totale et irréversible d’autonomie sur la tête du
  dirigeant.
illustration: images/TEE_eolienne.webp
opérateur de contact: Banque Publique d'Investissement France
autres opérateurs:
  - ADEME
contact question: https://contacts.bpifrance.fr/contactez-bpifrance-formulaire-de-contact/
url: https://www.bpifrance.fr/catalogue-offres/pret-methanisation-ademe-0
nature de l'aide: prêt
montant du prêt: de 100 000 € à 1 000 000 €
durée du prêt: De 3 à 12 ans pour rembourser votre prêt
