  - description: >-
      Complétez la fiche de demande préalable et envoyez-là au chargé de mission
      du département concerné.
    liens:
      - lien: >-
          https://les-aides.nouvelle-aquitaine.fr/system/files/specific_pj_files/2025_Fiche_demande_prealable_FC_CEE_VF.pdf
