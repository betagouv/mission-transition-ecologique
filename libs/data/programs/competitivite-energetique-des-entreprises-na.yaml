titre: Compétitivité énergétique des entreprises
promesse: >-
  Mettez en place un programme visant à réduire votre dépendance aux énergies
  fossiles
description: >-
  Cet appel à projets vous accompagne financièrement pour mener une étude ou un
  investissement visant à :


  - Mesurer et **connaître la consommation d’énergie** de votre entreprise.

  - **Réduire vos besoins** d’énergie (performance énergétique, récupération de
  chaleur perdue…).

  - **Substituer votre consommation d’énergie fossile par des énergies
  renouvelables** (électrification, méthanisation, hydrogène vert…).
description longue: |-
  Sont exclues de l'appel à projets : 

  • Les actions relevant de l’efficacité énergétique dans le transport.\
  • Les actions relevant de l’efficacité énergétique des bâtiments.\
  • L'installation de panneaux solaires photovoltaïques en autoconsommation.\
  • Tout projet relevant d’une mise en conformité réglementaire.
fin de validité: 31/12/2026
illustration: images/TEE_eolienne.webp
opérateur de contact: ADEME
autres opérateurs:
  - Région Nouvelle-Aquitaine
contact question: formulaire
url: >-
  https://librairie.ademe.fr/energies/5508-nouvelle-aquitaine-synthese-des-dispositifs-de-decarbonation-de-l-industrie-2025.html
nature de l'aide: financement
montant du financement: Variable selon projet
objectifs:
  - description: >-
      Consultez le règlement de l'appel à projets pour voir si vos
      investissements ou votre étude sont éligibles à un financement.
    liens:
