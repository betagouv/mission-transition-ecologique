titre: Travail et climat
promesse: >-
  Adaptez les activités de montagne, viticulture et zones d'eau avec les acteurs
  du territoire
description: >-
  Cet appel à projets, déployé dans les régions Auvergne-Rhône-Alpes, Occitanie
  et Provence-Alpes-Côte-d'Azur, vise à **soutenir les projets d'adaptation,
  d'atténuation et de redirection des effets du dérèglement climatique** sur
  l'activité de travail, au sein des **territoires viticoles, de montagne et
  d'eau**.
description longue: >-
  Les projets devront s'inscrire dans une dynamique de dialogue territorial
  associant des parties prenantes — acteurs économiques, partenaires sociaux,
  acteurs publics, etc. — afin de renforcer les coopérations, de créer des
  espaces d’échange dédiés aux enjeux écologiques et économiques locaux, et de
  tenir compte des spécificités et réalités propres à chaque territoire.
début de validité: 09/06/2026
fin de validité: 02/10/2026
illustration: images/TEE_ampoule.webp
opérateur de contact: ANACT
contact question: >-
  https://www.anact.fr/fact/appel-projets-travail-climat-aura-occitanie-paca#paragraph-202821
url: https://www.anact.fr/fact/appel-projets-travail-climat-aura-occitanie-paca
nature de l'aide: financement
montant du financement: Jusqu'à 80% du coût du projet
objectifs:
  - description: >-
      Découvrez le cadre de l'appel à projets et vérifiez l'éligibilité et la
      conformité de votre projet.
    liens:
      - lien: >-
          https://www.anact.fr/fact/appel-projets-travail-climat-aura-occitanie-paca
        texte: Détail de l'appel à projets
      - lien: >-
          https://www.anact.fr/sites/default/files/2026-03/logigramme-fact-e%CC%81ligibilite%CC%81_1.pdf
        texte: Conditions d'éligibilité
  - description: >-
