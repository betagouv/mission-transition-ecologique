    liens:
      - lien: >-
          https://regioniledefrancecrm.my.site.com/MonCompteRegion/s/campaignregisterunkown?CampaignId=701Sm00000Tk9imIAB
        texte: M'inscrire à une session de webinaire TP'up
      - lien: >-
          https://regioniledefrancecrm.my.site.com/MonCompteRegion/s/campaignregisterunkown?CampaignId=701Sm00000ZylbCIAR
        texte: M'inscrire à une session de webinaire PM'up
  - description: >-
      Créez un compte sur mesdemarches.iledefrance.fr pour pouvoir déposer votre
