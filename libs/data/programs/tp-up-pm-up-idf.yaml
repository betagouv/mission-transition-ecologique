    liens:
      - lien: >-
          https://mesdemarches.iledefrance.fr/account-management/cridfprd-demandeurs/ux/#/account-creation?redirectTo=https:%2F%2Fmesdemarches.iledefrance.fr%2Faides%2F%23%2Fcridfprd%2Fconnecte%2Ftiers-selection&jwtKey=jwt-cridfprd-portail-depot-demande-aides&footer=https:%2F%2Fmesdemarches.iledefrance.fr%2Faides%2F%23%2Fcridfprd%2Faccessibilite,Accessibilit%C3%A9%20:%20partiellement%20conforme,_self;https:%2F%2Fmesdemarches.iledefrance.fr%2Faides%2F%23%2Fcridfprd%2Fmentions-legales,Mentions%20l%C3%A9gales%20et%20RGPD,_self
        texte: Créer mon compte
  - description: >-
      Déposez votre dossier de candidature. S'il est retenu, recevez les
      informations concernant le calendrier et les modalités de financement.
conditions d'éligibilité:
  taille de l'entreprise:
    - Moins de 250 salariés
    - Éligible aux micro-entreprises
  secteur géographique:
    - Île-de-France
  secteur d'activité:
    - >-
      - Secteurs non éligibles à cette aide :


      * Activités de négoce.

      * Activités de conseil aux entreprises et aux particuliers.

      * Professions réglementées ou assimilées (professions libérales,
      professions organisées en ordre...).

      * Activités financières, assurances et immobilier.

      * Activités de café, hôtel et restaurant.

      * Organismes et établissements de formation.

      * Transport routier de marchandises.

      * Activités de logistiques.

      * Entreprises de conseil, maintenance et formation dans les services du
      numérique.

      * Services à la personne.

      * Secteur de la communication et du multimédia (agences/plateformes de
      webmarketing, de relation client, publicité, presse, télévision, radio,
      réseaux sociaux et influenceurs...).

      * Secteur primaire agricole, pêche et aquaculture et forêt.
  nombre d'années d'activité:
    - Éligible à toutes les entreprises
publicodes:
  entreprise . est ciblée:
    toutes ces conditions:
      - est éligible
      - est dans un secteur d'activité ciblé
      - a un objectif ciblé
  entreprise . est éligible:
    applicable si: date du jour <= dispositif . fin de validité
    toutes ces conditions:
      - a un effectif éligible
      - entreprise . est dans une zone géographique éligible
  entreprise . a un effectif éligible:
    toutes ces conditions:
      - effectif <= 249
  entreprise . est dans un secteur d'activité ciblé:
