titre: TP'up et PM'up
promesse: >-
  Financez vos investissements, conseils ou recrutement en faveur de la
  transition écologique
description: >-
  La Région Île de France accompagne financièrement les TPE et les PME dans leur
  transition écologique et énergétique, ainsi que dans les projets créateurs
  d'emplois, à travers deux dispositifs : TP'up et PM'up.
description longue: "Sont éligibles les projets de filières et d'activités stratégiques régionales et de l'économie sociale et solidaire, avec des enjeux de souveraineté, d'industrialisation et de décarbonation.\n\n\n\nLes dépenses éligibles sont :\_\n\n- Les investissements matériels /immatériels.\n- Les prestations de conseil.\n- Le développement international.\n- Un recrutement sur une fonction «\_Transition écologique et énergétique\_»."
fin de validité: 31/12/2050
illustration: images/TEE_ampoule.webp
opérateur de contact: Région Île-de-France
contact question: mailto:aides.economiques@iledefrance.fr
url: https://www.iledefrance.fr/aides-et-appels-a-projets/tpup
nature de l'aide: financement
montant du financement: Jusqu'à 55 000 € pour les TPE et 250 000 € pour les PME.
objectifs:
