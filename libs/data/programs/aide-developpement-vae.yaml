titre: Aide au développement de flottes de Vélo à assistance électrique - Corse
promesse: >-
  Accélérez la mobilité douce au sein de votre entreprise en mettant à
  disposition une flotte de VAE
description: >-
  Vous souhaitez mettre **à disposition de vos clients ou de vos salariés** une
  **flotte de vélos à assistance électrique** (VAE) et/ou installer une
  **station de recharge** des VAE sur votre site ?


  Bénéficiez d'un accompagnement sur mesure sur les plans financiers et
  techniques.
description longue: "- **De 1 à 3 VAE** achetés\_**:** **aide de\_25%**\_plafonnée à **500 €**/VAE.\n- **À partir de 4 VAE\_(ou plus)** achetés :\_**aide de\_25%**\_plafonnée à **1 000€**/VAE.\n- **Stations de recharge\_: aide de 50%**\_plafonnée à **4000€**/point de charge\_et bonifiée à\_**60%**\_en cas de station rechargée en énergie renouvelable.\n\nAvant d'acheter votre flotte de VAE ou de mettre en place votre station de recharge, adressez votre demande\_de soutien financier à l'AUE."
illustration: images/TEE_eolienne.webp
opérateur de contact: Agence d’Aménagement durable, d’Urbanisme et d’Energie de la Corse
contact question: https://www.aue.corsica/Contact_a649.html
url: >-
  https://www.aue.corsica/Aide-a-l-achat-des-Velos-a-Assistance-Electrique_a856.html
nature de l'aide: financement
montant du financement: 500 €/vélo, puis 1000 €/vélo au-delà de 4 VAE
objectifs:
  - description: >-
      Contactez l'AUE pour évaluer votre éligibilité et la pertinence de votre
      projet.
  - description: >-
      Remplissez la demande de subvention et joignez les éventuels documents
      associés (cahier des charges).
    liens:
      - lien: https://www.aue.corsica/attachment/2718338/
        texte: Demande de subvention
  - description: >-
      Obtenez un devis conforme au cahier des charges de l'AUE de la part d'une
      entreprise agréée.
  - description: >-
      Adressez la demande de subvention accompagnée des pièces complémentaires
      requises à l'AUE, par mail ou voie postale. Le dossier est alors instruit
      et présenté en instance délibérative de l'agence.
  - description: >-
      Si votre demande est acceptée, réalisez les travaux et envoyez les preuves
      de réalisation conformes aux attentes de l'AUE. La subvention est alors
      versée sur facture acquittée.
conditions d'éligibilité:
  taille de l'entreprise:
    - Toutes tailles
    - Éligible aux micro-entreprises
  secteur géographique:
    - Corse
  secteur d'activité:
    - Tous secteurs d'activité
  nombre d'années d'activité:
    - Éligible à toutes les entreprises
