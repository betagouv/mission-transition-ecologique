titre: Aide à la rénovation de l'éclairage extérieur - Corse
promesse: >-
  Modernisez votre éclairage extérieur gâce à un financement et un appui
  technique
description: >-
  Vous avez déjà évalué la faisabilité d'une rénovation de votre éclairage
  extérieur à l'aide d'une étude dédiée et vous souhaitez démarrer les travaux ?
  \

  Bénéficiez d'un **financement** et de l'**accompagnement d'un expert** pour
  remplacer votre éclairage par des **solutions performantes et peu coûteuses en
  énergie.**
description longue: >-
  Cette aide soutient les collectivités et entreprises dans la transition vers
  un éclairage extérieur plus performant, en finançant une partie du projet.
  Elle s’accompagne d’un appui technique pour définir les choix d’équipements,
  optimiser la consommation et garantir la qualité des installations.
fin de validité: 31/12/2028
illustration: images/TEE_eolienne.webp
opérateur de contact: Agence d’Aménagement durable, d’Urbanisme et d’Energie de la Corse
contact question: https://www.aue.corsica/Contact_a649.html
url: https://www.aue.corsica/Le-guide-des-primes_a206.html
nature de l'aide: financement
montant du financement: Jusqu'à 70% des dépenses éligibles, dans la limite de 500 € par point lumineux
objectifs:
  - description: >-
      Contactez l'AUE pour évaluer votre éligibilité et la pertinence de votre
      projet.
  - description: >-
      Remplissez la demande de subvention et joignez les éventuels documents
      associés (cahier des charges).
    liens:
      - lien: https://www.aue.corsica/attachment/2718338/
        texte: Demande de subvention
  - description: >-
      Obtenez un devis conforme au cahier des charges de l'AUE de la part d'une
      entreprise agréée.
  - description: >-
      Adressez la demande de subvention accompagnée des pièces complémentaires
      requises à l'AUE, par mail ou voie postale. Le dossier est alors instruit
      et présenté en instance délibérative de l'agence.
  - description: >-
      Si votre demande est acceptée, réalisez les travaux et envoyez les preuves
      de réalisation conformes aux attentes de l'AUE. La subvention est alors
      versée sur facture acquittée.
