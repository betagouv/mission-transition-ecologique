titre: Autodiagnostic Eau - Salons de coiffure
promesse: Economisez l'eau dans votre salon de coiffure
description: "Détection de fuites d'eau, matériel adapté au bac à shampooing et au lavage du linge, sensibilisation de vos équipes... la CMA Auvergne-Rhône-Alpes\_vous accompagne pour réaliser des économies d'eau et réduire vos factures au sein de votre salon de coiffure. \n\nUn autodiagnostic gratuit vous permet en 5 minutes :\n\n- D'identifier vos postes les plus consommateurs en eau.\n- D'élaborer une liste d'actions vous permettant de réaliser jusqu'à 30% d'économie d'eau.\n- De comprendre comment impliquer vos équipes à travers une série d'éco-gestes."
illustration: images/TEE_ampoule.webp
opérateur de contact: Chambre des Métiers et de l'Artisanat
autres opérateurs:
  - CMA Auvergne-Rhône-Alpes
contact question: https://autodiagnostic-eau.cma-auvergnerhonealpes.fr/contact-cma/
url: https://autodiagnostic-eau.cma-auvergnerhonealpes.fr/signup/?next=/
nature de l'aide: étude
coût de l'accompagnement: gratuit
durée de l'accompagnement: 15 minutes
objectifs:
  - description: 'Inscrivez-vous sur la plateforme CMA AURA pour démarrer le diagnostic. '
    liens:
      - lien: https://autodiagnostic-eau.cma-auvergnerhonealpes.fr/signup/?next=/
        texte: M'inscrire
  - description: >-
      Effectuez le diagnostic en 5 minutes chrono, en répondant à des questions
      simples concernant les pratiques et les équipements du salon.
  - description: >-
      Recevez un plan d'actions personnalisé et des conseils pratiques à mettre
      en place au sein de votre salon de coiffure.
conditions d'éligibilité:
  taille de l'entreprise:
    - toute taille
    - Éligible aux micro-entreprises
  secteur géographique:
    - France et territoires d'outre-mer
  secteur d'activité:
    - Salons de coiffure
    - 9602A | 960211 | 960212 | 960214 | 960220
  nombre d'années d'activité:
    - Éligible à toutes les entreprises
publicodes:
  entreprise . est ciblée:
    toutes ces conditions:
      - est éligible
      - est dans un secteur d'activité ciblé
      - a un objectif ciblé
  entreprise . est éligible:
    applicable si: date du jour <= dispositif . fin de validité
    valeur: oui
  entreprise . est dans un secteur d'activité ciblé:
    une de ces conditions:
      - code NAF niveau 1 . est Q
      - code NAF niveau 1 . est S
      - code NAF niveau 1 . est T
  entreprise . a un objectif ciblé:
    une de ces conditions:
      - >-
        questionnaire . objectif prioritaire . est diminuer ma consommation
        d'eau
