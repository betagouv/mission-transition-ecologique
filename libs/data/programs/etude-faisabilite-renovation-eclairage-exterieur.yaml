titre: Étude de faisabilité de rénovation de l'éclairage extérieur - Corse
promesse: Évaluez la pertinence de la rénovation de votre éclairage extérieur
description: >-
  Vous souhaitez rénovez votre éclairage extérieur ? Bénéficiez d'une expertise
  technique pour évaluer la pertinence de votre projet. Ainsi vous : 


  - Adoptez un éclairage performant.

  - Diminuez votre facture énergétique.

  - Mobilisez les aides adaptées à la rénovation.
description longue: >-
  Le taux d'accompagnement maximal est fixé à 70% pour les petites entreprises,
  60% pour les moyennes entreprises et 50% pour les grandes entreprises au sens
  de la réglementation européenne sur les aides d'État
illustration: images/TEE_energie_verte.webp
opérateur de contact: Agence d’Aménagement durable, d’Urbanisme et d’Energie de la Corse
contact question: https://www.aue.corsica/Contact_a649.html
url: https://www.aue.corsica/Le-guide-des-primes_a206.html
nature de l'aide: étude
montant du financement: Jusqu'à 70% du coût de la prestation
objectifs:
  - description: >-
      Contactez l'AUE pour évaluer votre éligibilité et la pertinence de votre
      projet.
  - description: >-
      Remplissez la demande de subvention et joignez les éventuels documents
      associés (cahier des charges).
    liens:
      - lien: https://www.aue.corsica/attachment/2718338/
        texte: Demande de subvention
  - description: >-
      Obtenez un devis conforme au cahier des charges de l'AUE de la part d'une
      entreprise agréée.
  - description: >-
      Adressez la demande de subvention accompagnée des pièces complémentaires
      requises à l'AUE, par mail ou voie postale. Le dossier est alors instruit
      et présenté en instance délibérative de l'agence.
  - description: >-
      Si votre demande est acceptée, réalisez l'étude et envoyez les preuves de
      réalisation conformes aux attentes de l'AUE. La subvention est alors
      versée sur facture acquittée.
conditions d'éligibilité:
  taille de l'entreprise:
    - Toutes tailles
    - Éligible aux micro-entreprises
  secteur géographique:
    - Corse
  secteur d'activité:
    - Tous secteurs d'activité
  nombre d'années d'activité:
    - Éligible à toutes les entreprises
