titre: Contrat 3S - Stratégique Structurant Souverain
promesse: >-
  Bénéficiez d'un accompagnement pour vos projets d'innovation et de
  transformation sociale et environnementale
description: >-
  Vous souhaitez développer un projet générateur d’emplois et présentant un
  fort\

  impact en réponse aux enjeux environnementaux ? La Région Occitanie vous
  accompagne sur les **volets d'innovation et de transformation**, notamment sur
  :


  - La mise en place de nouveaux **process de production** ou de services plus
  **sobres en consommation de ressources** (eau, énergie, matières premières
  d’extraction ou agricoles…) et générant moins d’émissions polluantes et de
  déchets.

  - L'augmentation de la **durabilité et réemploi des produits** (fiabilité,
  démontabilité, réparabilité, séparabilité et facilitation du tri en fin de
  vie).

  - La **préservation des ressources** par le **choix des matériaux**, par la
  réduction,\
    l’élimination ou le réemploi des emballages, la réduction des besoins et ressources liées à l’entretien et à la maintenance.
  - La **transition agroécologique**.
illustration: images/TEE_eolienne.webp
opérateur de contact: Région Occitanie
autres opérateurs:
  - ADEME
contact question: mailto:contact-hub@laregion.fr
url: https://hubentreprendre.laregion.fr/financement/contrat-3s-volet-innovation
nature de l'aide: financement
montant du financement: Selon projet
