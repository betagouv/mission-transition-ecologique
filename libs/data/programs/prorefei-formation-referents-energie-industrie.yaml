titre: PROREFEI formation dédiée aux référents énergie dans l'industrie
promesse: Formez-vous à l'efficacité énergétique dans l'industrie
description: >-
  Le parcours PROREFEI propose deux parcours distincts, à destination des
  salariés de l'industrie :


  - Un **parcours de formation en trois modules** comprenant un **MOOC**, un
  **stage de 2 jours** et du **coaching en situation de travail**.

  - Une **formation** sur l'un des thèmes suivants : **Achats d'énergie,
  Énergies renouvelables** ou **Plan de mesurage**. 


  À l'issue de ces formations, vous : 


  - Maîtrisez les notions de base de l’efficacité énergétique en industrie.

  - Êtes familier des unités énergétiques.

  - Savez analyser une facture électrique.

  - Comprenez et identifiez les différents systèmes énergétiques de votre
  entreprise.

  - Êtes en mesure de caractériser les principaux paramètres électriques de
  votre profil utilisateur
description longue: >-
  Dans le cadre de la formation en trois modules, un test de positionnement est
  réalisé au début du MOOC et permet d'orienter la personne entre 2 parcours
  équivalents (un technique, l'autre moins technique = profil management). À la
  fin du parcours, il est possible de choisir de réaliser en plus le parcours de
  l'autre profil. Si vous souhaitez réaliser les modules 2 et 3 de la formation
  PROREFEI, il est nécessaire d'avoir obtenu au moins 70% de bonnes réponses au
  quiz final.\

  \

  Si vous réalisez le parcours en trois modules entièrement, vous pouvez
  peut-être bénéficier d'une prise en charge PACTE Industrie à hauteur de 70%
  des coûts pédagogiques.
