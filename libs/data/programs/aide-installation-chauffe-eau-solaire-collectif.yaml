titre: Aide à l'installation d'un chauffe-eau solaire collectif - Corse
promesse: >-
  Bénéficiez d'un accompagnement financier et technique dans votre projet
  solaire thermique
description: >-
  Vous avez des besoins conséquents en **eau chaude sanitaire (ou
  climatisation)** et vous souhaitez installer un système de production d'eau
  chaude solaire ? \

  Cet appel à projets vous offre un **soutien financier et technique** de bout
  en bout, et vous permet de r**entabiliser votre installation en moins de 5
  ans**.
description longue: "L’appel à projets s’adresse particulièrement aux secteurs suivants : \n\n- **Le secteur touristique**\_: Hôtels, restaurants et campings, et autres hébergements touristiques.\n- **Le secteur de la santé**\_: Hôpitaux, cliniques et maisons de retraite, EPHAD.\n- **Le secteur du logement social**\_: Patrimoine des bailleurs sociaux.\n- **Le secteur public**\_: Patrimoine des collectivités."
fin de validité: 31/12/2028
illustration: images/TEE_ampoule.webp
opérateur de contact: Agence d’Aménagement durable, d’Urbanisme et d’Energie de la Corse
contact question: https://www.aue.corsica/Contact_a649.html
url: https://www.aue.corsica/Appel-a-projets-Solaire-Thermique-Collectif_a183.html
nature de l'aide: financement
montant du financement: Jusqu'à 80% des dépenses
objectifs:
  - description: >-
      Contactez l'AUE pour évaluer votre éligibilité et la pertinence de votre
      projet.
  - description: >-
      Remplissez la demande de subvention et joignez les éventuels documents
      associés (cahier des charges).
    liens:
      - lien: https://www.aue.corsica/attachment/2718338/
        texte: Demande de subvention
  - description: >-
      Obtenez un devis conforme au cahier des charges de l'AUE de la part d'une
      entreprise agréée.
  - description: >-
      Adressez la demande de subvention accompagnée des pièces complémentaires
      requises à l'AUE, par mail ou voie postale. Le dossier est alors instruit
      et présenté en instance délibérative de l'agence.
  - description: >-
      Si votre demande est acceptée, réalisez les travaux et envoyez les preuves
      de réalisation conformes aux attentes de l'AUE. La subvention est alors
      versée sur facture acquittée.
conditions d'éligibilité:
