titre: Aide à l'installation d'une chauderie biomasse collective - Corse
promesse: Bénéficiez d'un accompagnement pour l'installation d'une chauderie biomasse
description: >-
  Vous avez un projet d'installation de **chauderie biomasse** dans votre
  entreprise, pour le **chauffage** et/ou l'**eau chaude sanitaire** ? \

  Ce dispositif vous soutient financièrement et vous apporte une **expertise
  technico-économique** de bout en bout.
description longue: >-
  L’aide finance une part des coûts d’installation d’une chaufferie biomasse
  collective, tout en offrant un accompagnement technique pour définir les
  besoins, choisir les équipements adéquats et sécuriser la réalisation. Elle
  permet de déployer une solution performante, durable et adaptée aux ressources
  locales. Le soutien financier est très important, faisant de cette solution
  l'une des plus appropriées dans le grand tertiaire, notamment dans le cas
  d'une substitution de chaudière à énergie fossile.
fin de validité: 31/12/2028
illustration: images/TEE_energie_verte.webp
opérateur de contact: Agence d’Aménagement durable, d’Urbanisme et d’Energie de la Corse
contact question: https://www.aue.corsica/Contact_a649.html
url: >-
  https://www.aue.corsica/Collectivites-entreprises-passez-au-Bois-Energie-_a790.html
nature de l'aide: financement
montant du financement: Jusqu'à 70% d'aide sur le surcoût par rapport à une solution de référence
objectifs:
  - description: >-
      Contactez l'AUE pour évaluer votre éligibilité et la pertinence de votre
      projet.
  - description: >-
      Remplissez la demande de subvention et joignez les éventuels documents
      associés (cahier des charges).
    liens:
      - lien: https://www.aue.corsica/attachment/2718338/
        texte: Demande de subvention
  - description: >-
      Obtenez un devis conforme au cahier des charges de l'AUE de la part d'une
      entreprise agréée.
  - description: >-
      Adressez la demande de subvention accompagnée des pièces complémentaires
      requises à l'AUE, par mail ou voie postale. Le dossier est alors instruit
      et présenté en instance délibérative de l'agence.
  - description: >-
      Si votre demande est acceptée, réalisez les travaux et envoyez les preuves
      de réalisation conformes aux attentes de l'AUE. La subvention est alors
      versée sur facture acquittée.
